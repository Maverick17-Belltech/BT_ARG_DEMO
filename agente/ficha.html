<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha del cliente · BT_ARG Demo</title>
<!--
  BT_ARG_DEMO · Ficha del cliente para el agente (CXone Agent, POPURL → ContactPanel)  v3 (render instantáneo + historial)
  DEMO Belltech Argentina: TODOS LOS DATOS SON FICTICIOS. Esta página solo LEE datos.

  1) Se dibuja AL INSTANTE con los datos que manda el IVR en el link (nombre, alertas, cómo se identificó).
  2) Después completa en segundo plano desde la API (planilla): datos personales, producto, vista 360,
     historial de interacciones (planilla aparte BT_ARG_Interacciones_Demo) y cambios de datos (pestaña Historial).

  Parámetros (todos opcionales salvo dni y vertical):
    dni, vertical (BANCA|SEGUROS|FINANCIERA|LUZ|GAS), contacto, dato (DNI|MEDIDOR|CUENTA|CLIENTEGAS), ivr, res
    nom, ape          nombre y apellido que ya conoce el IVR
    escli             SI | NO  (cliente de esta vertical)
    venc              SI | NO  (DNI vencido)
    deuda             importe de deuda (Luz/Gas), ej. 12500.00
    mora              SI | NO  (Financiera)
  Ej.: agente/ficha.html?dni=33777888&vertical=GAS&dato=CLIENTEGAS&ivr=3-1&nom=Sebastian&ape=Sosa&escli=SI&venc=NO&deuda=12500.00&mora=NO
-->
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #1d2733; --muted: #5b6878; --line: #e2e7ed;
    --brand: #1f4e78; --brand-soft: #e8eef5;
    --ok: #1e7b45; --ok-soft: #e5f4ec; --warn: #9a5b00; --warn-soft: #fff3df;
    --bad: #b42318; --bad-soft: #fde8e6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: var(--text); background: var(--bg); }
  header { background: var(--brand); color: #fff; padding: 14px 16px; }
  header .marca { font-size: 18px; font-weight: bold; }
  header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  main { padding: 12px; display: grid; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  .nombre { font-size: 20px; font-weight: bold; margin: 0 0 4px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: bold; word-break: break-word; }
  .alertas { display: grid; gap: 8px; }
  .alerta { border-radius: 6px; padding: 10px 12px; font-weight: bold; }
  .alerta.bad { background: var(--bad-soft); color: var(--bad); border-left: 4px solid var(--bad); }
  .alerta.warn { background: var(--warn-soft); color: var(--warn); border-left: 4px solid var(--warn); }
  .alerta.ok { background: var(--ok-soft); color: var(--ok); border-left: 4px solid var(--ok); }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; background: var(--brand-soft); color: var(--brand); margin: 2px 4px 2px 0; }
  .chip.si { background: var(--ok-soft); color: var(--ok); }
  .chip.no { background: #eef0f3; color: var(--muted); }
  .chip.venc { background: var(--warn-soft); color: var(--warn); }
  .cargando { color: var(--muted); font-style: italic; }
  .estado { text-align: center; padding: 40px 16px; color: var(--muted); }
  footer { padding: 8px 12px 16px; font-size: 11px; color: var(--muted); text-align: center; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: bold; background: #f8fafb; }
  tr.actual td { background: var(--brand-soft); font-weight: bold; }
  .tabla { overflow-x: auto; }
  @media (min-width: 720px) { main { grid-template-columns: 1fr 1fr; } .full { grid-column: 1 / -1; } }
</style>
</head>
<body>
<header>
  <div class="marca" id="marca">Ficha del cliente</div>
  <div class="sub" id="subtitulo">Belltech Argentina · Demo NICE CXone</div>
</header>
<main id="contenido">
  <div class="estado full">Cargando datos del cliente…</div>
</main>
<footer>DEMO Belltech Argentina · Datos ficticios · Fuentes: BT_ARG_Alta_Datos_Demo (clientes y cambios) · BT_ARG_Interacciones_Demo (historial) · Google Sheets</footer>

<script>
// URL pública de lectura de la API de la demo (Apps Script). Solo lectura: no hay claves en esta página.
const API = "https://script.google.com/macros/s/AKfycbwmYcSf9tH_sZeU-rq1fZzFKtT7vawtmUJFaOJFmbiBiDBH8-m5vgQiYL_4qbEAbinOiA/exec";

const MARCAS = {
  BANCA:      { nombre: "Banco Andino",      rubro: "Banca",        color: "#1f4e78", clave: "banca" },
  SEGUROS:    { nombre: "Seguros del Plata", rubro: "Seguros",      color: "#5b2c83", clave: "seguros" },
  FINANCIERA: { nombre: "Crédito Pampa",     rubro: "Financiera",   color: "#0f6e5a", clave: "financiera" },
  GAS:        { nombre: "EnerGas Sur",       rubro: "Gas",          color: "#c4511a", clave: "gas" },
  LUZ:        { nombre: "VoltaSur Energía",  rubro: "Electricidad", color: "#b8860b", clave: "luz" }
};
const ETIQUETAS = {
  segmento: "Segmento", cuenta: "Cuenta", tarjeta: "Tarjeta", saldo: "Saldo", resumenDigital: "Resumen digital",
  poliza: "Póliza", ramo: "Ramo", cobertura: "Cobertura", vigenciaHasta: "Vigente hasta", siniestroAbierto: "Siniestro abierto",
  prestamo: "Préstamo", cuotasTotales: "Cuotas totales", cuotasPagas: "Cuotas pagas", cuotaMensual: "Cuota mensual",
  enMora: "En mora", diasMora: "Días de mora",
  nroMedidor: "N° de medidor", nroCuenta: "N° de cuenta", nroCliente: "N° de cliente",
  domicilioSuministro: "Domicilio de suministro", deuda: "Deuda", facturaDigital: "Factura digital"
};
const MONEDA = ["saldo", "cuotaMensual", "deuda"];
const DATO_TXT = { DNI: "DNI", MEDIDOR: "N° de medidor", CUENTA: "N° de cuenta", CLIENTEGAS: "N° de cliente" };

const q = new URLSearchParams(location.search);
const P = {
  dni: (q.get("dni") || "").replace(/\D/g, ""),
  vertical: (q.get("vertical") || "").toUpperCase(),
  contacto: q.get("contacto") || "",
  dato: (q.get("dato") || "").toUpperCase(),
  ivr: q.get("ivr") || "",
  nom: q.get("nom") || "",
  ape: q.get("ape") || "",
  escli: (q.get("escli") || "").toUpperCase(),
  venc: (q.get("venc") || "").toUpperCase(),
  deuda: q.get("deuda") || "",
  mora: (q.get("mora") || "").toUpperCase()
};
const marca = MARCAS[P.vertical];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pesos = (v) => {
  const n = Number(String(v).replace(",", "."));
  return isNaN(n) ? esc(v) : "$ " + n.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
const siNo = (v) => (v === true || String(v).toLowerCase() === "true" || String(v).toUpperCase() === "SI");
const CARGANDO = '<p class="cargando">Consultando sistema…</p>';

// Estado: arranca con lo que mandó el IVR; la API lo completa después.
const E = {
  nombre: P.nom, apellido: P.ape,
  esCliente: P.escli ? P.escli === "SI" : null,
  dniVencido: P.venc === "SI",
  deuda: P.deuda, enMora: P.mora === "SI",
  persona: null, producto: null, cli: null, apiError: false,
  historial: null, cambios: null
};

function alertas() {
  const a = [];
  const vert = P.vertical;
  const prod = E.producto || {};
  const deuda = prod.deuda !== undefined ? prod.deuda : E.deuda;
  const mora = prod.enMora !== undefined ? siNo(prod.enMora) : E.enMora;
  if (E.esCliente === false && marca) a.push(["warn", `No es cliente de ${marca.nombre}: oportunidad comercial.`]);
  if (["GAS", "LUZ"].includes(vert) && Number(deuda) > 0)
    a.push(["bad", `Deuda de ${pesos(deuda)}: riesgo de ${vert === "GAS" ? "suspensión" : "corte"} del suministro.`]);
  if (vert === "FINANCIERA" && mora)
    a.push(["bad", `Préstamo en mora${prod.diasMora ? ` (${esc(prod.diasMora)} días)` : ""}.`]);
  if (vert === "SEGUROS" && siNo(prod.siniestroAbierto)) a.push(["warn", "Tiene un siniestro abierto."]);
  if (["BANCA", "FINANCIERA"].includes(vert) && E.dniVencido)
    a.push(["warn", `DNI vencido${E.persona ? ` (venció el ${esc(E.persona.vencimiento)})` : ""}. Solicitar actualización.`]);
  if (a.length === 0) a.push(["ok", "Sin alertas. Cliente al día."]);
  return a.map(([t, m]) => `<div class="alerta ${t}">${m}</div>`).join("");
}

function bloquePersona() {
  if (E.apiError) return '<p class="cargando">No se pudo consultar el sistema. Los datos de arriba vienen del IVR.</p>';
  const p = E.persona;
  if (!p) return CARGANDO;
  const dom = [p.calle, p.numeroCalle, p.piso && `Piso ${p.piso}`, p.departamento && `Dto. ${p.departamento}`].filter(Boolean).join(" ");
  return `<dl>
    <dt>DNI</dt><dd>${esc(P.dni)}</dd>
    <dt>CUIL</dt><dd>${esc(p.cuil)}</dd>
    <dt>Nacimiento</dt><dd>${esc(p.fechaNacimiento)}</dd>
    <dt>Domicilio</dt><dd>${esc(dom)}</dd>
    <dt>Localidad</dt><dd>${esc(p.ciudad)}, ${esc(p.provincia)} (${esc(p.cpostal)})</dd>
    <dt>Ejemplar DNI</dt><dd>${esc(p.ejemplar)} · vence ${esc(p.vencimiento)}</dd>
  </dl>`;
}

function bloqueProducto() {
  if (E.apiError) return "";
  if (!E.cli) {
    // Mientras carga: si el IVR mandó la deuda, se muestra ya
    return (["GAS", "LUZ"].includes(P.vertical) && E.deuda !== "")
      ? `<dl><dt>Deuda</dt><dd>${pesos(E.deuda)}</dd></dl>${CARGANDO}` : CARGANDO;
  }
  const prod = E.producto;
  if (!prod || !prod.esCliente) return `<p>Sin productos de ${esc(marca ? marca.nombre : "esta marca")}.</p>`;
  return "<dl>" + Object.keys(prod)
    .filter(k => !["esCliente", "cantidadProductos"].includes(k))
    .map(k => {
      let v = prod[k];
      if (MONEDA.includes(k)) v = pesos(v);
      else if (typeof v === "boolean" || ["true", "false"].includes(String(v).toLowerCase())) v = siNo(v) ? "Sí" : "No";
      else v = esc(v);
      return `<dt>${esc(ETIQUETAS[k] || k)}</dt><dd>${v}</dd>`;
    }).join("") + "</dl>";
}

function bloque360() {
  if (E.apiError) return "";
  if (!E.cli) return CARGANDO;
  return Object.values(MARCAS).map(m => {
    const es = E.cli[m.clave] && E.cli[m.clave].esCliente;
    return `<span class="chip ${es ? "si" : "no"}">${esc(m.nombre)}: ${es ? "cliente" : "no"}</span>`;
  }).join("");
}

const RES_TXT = { OK: "Identificado", NO_CLIENTE: "No cliente", FALLO: "No validado", ERROR_API: "Sin validar (error)" };
const fechaCorta = (f) => esc(String(f || "").replace(/^(\d{4})-(\d{2})-(\d{2})/, "$3/$2/$1"));

function bloqueHistorial() {
  if (E.apiError) return '<p class="cargando">No se pudo consultar el historial.</p>';
  if (!E.historial) return CARGANDO;
  const filas = E.historial.slice();
  // El contacto en curso puede no estar registrado todavía: se muestra igual, destacado
  const yaEsta = P.contacto && filas.some(r => String(r.contactId) === String(P.contacto));
  if (P.contacto && !yaEsta) {
    filas.unshift({ fechaHora: "En curso", marca: marca ? marca.nombre : "", canal: "Voz", dato: P.dato, ivr: P.ivr,
                    resultado: "OK", agente: "", contactId: P.contacto, disposicion: "" });
  }
  if (filas.length === 0) return "<p>Sin interacciones registradas.</p>";
  return `<div class="tabla"><table>
    <tr><th>Fecha</th><th>Marca</th><th>Canal</th><th>Se identificó con</th><th>IVR</th><th>Resultado</th><th>Agente</th><th>Conclusión / tema</th></tr>
    ${filas.map(r => `<tr class="${String(r.contactId) === String(P.contacto) ? "actual" : ""}">
      <td>${String(r.contactId) === String(P.contacto) ? "Ahora" : fechaCorta(r.fechaHora)}</td>
      <td>${esc(r.marca)}</td><td>${esc(r.canal)}</td>
      <td>${esc(DATO_TXT[String(r.dato).toUpperCase()] || r.dato || "—")}</td>
      <td>${esc(r.ivr || "—")}</td>
      <td>${esc(RES_TXT[r.resultado] || r.resultado || "—")}</td>
      <td>${esc(r.agente || "—")}</td>
      <td>${esc(r.disposicion || "—")}</td></tr>`).join("")}
  </table></div>`;
}

function bloqueCambios() {
  if (E.apiError || !E.cambios) return E.apiError ? "" : CARGANDO;
  if (E.cambios.length === 0) return "<p>Sin cambios de datos registrados.</p>";
  return `<div class="tabla"><table>
    <tr><th>Fecha</th><th>Dato</th><th>Antes</th><th>Ahora</th><th>Agente</th></tr>
    ${E.cambios.map(c => `<tr><td>${fechaCorta(c.fechaHora)}</td><td>${esc(c.campo)} (${esc(c.hoja)})</td>
      <td>${esc(c.valorAnterior)}</td><td>${esc(c.valorNuevo)}</td><td>${esc(c.agente || "—")}</td></tr>`).join("")}
  </table></div>`;
}

function render() {
  const nombre = `${E.nombre} ${E.apellido}`.trim() || (E.persona ? `${E.persona.nombres} ${E.persona.apellido}` : `DNI ${P.dni}`);
  const chipCli = E.esCliente === null ? "" : `<span class="chip">${E.esCliente ? "Cliente" : "No cliente"}</span>`;
  const chipDni = `<span class="chip ${E.dniVencido ? "venc" : "si"}">DNI ${E.dniVencido ? "vencido" : "vigente"}</span>`;
  $("contenido").innerHTML = `
    <section class="card full">
      <p class="nombre">${esc(nombre)}</p>${chipCli}${chipDni}
    </section>
    <section class="card full"><h2>Alertas</h2><div class="alertas">${alertas()}</div></section>
    <section class="card"><h2>Datos personales</h2>${bloquePersona()}</section>
    <section class="card"><h2>${esc(marca ? marca.nombre : "Producto")}</h2>${bloqueProducto()}</section>
    <section class="card">
      <h2>Contacto actual</h2>
      <dl>
        <dt>ID de contacto</dt><dd>${esc(P.contacto || "—")}</dd>
        <dt>Se identificó con</dt><dd>${esc(DATO_TXT[P.dato] || P.dato || "—")}</dd>
        <dt>Opciones en el IVR</dt><dd>${esc(P.ivr || "—")}</dd>
        <dt>Validación</dt><dd>Padrón (formato RENAPER) + sistema comercial</dd>
      </dl>
    </section>
    <section class="card"><h2>Vista 360 · Grupo Belltech Demo</h2>${bloque360()}</section>
    <section class="card full"><h2>Historial de interacciones</h2>${bloqueHistorial()}</section>
    <section class="card full"><h2>Cambios de datos</h2>${bloqueCambios()}</section>`;
}

async function api(tipo, id) {
  const r = await fetch(`${API}?tipo=${encodeURIComponent(tipo)}&id=${encodeURIComponent(id)}`);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function completarDesdeApi() {
  try {
    const [ren, cli, hist] = await Promise.all([
      api("renaper", P.dni), api("clientes", P.dni),
      api("interacciones", P.dni).catch(() => ({ interacciones: [], cambios: [] }))
    ]);
    E.historial = (hist && hist.interacciones) || [];
    E.cambios = (hist && hist.cambios) || [];
    if (ren && !ren.error && ren.respuesta) {
      E.persona = ren.respuesta;
      if (E.persona._demo) E.dniVencido = !E.persona._demo.vigente;
      if (!E.nombre) { E.nombre = cli.nombre || E.persona.nombres; E.apellido = cli.apellido || E.persona.apellido; }
    }
    if (cli && cli.encontrado !== false) {
      E.cli = cli;
      E.producto = marca ? (cli[marca.clave] || { esCliente: false }) : null;
      if (E.producto) E.esCliente = !!E.producto.esCliente;
    }
  } catch (e) {
    E.apiError = true;
  }
  render();
}

// ---- Inicio ----
if (marca) {
  document.documentElement.style.setProperty("--brand", marca.color);
  $("marca").textContent = marca.nombre;
  $("subtitulo").textContent = `${marca.rubro} · Ficha del cliente · Demo NICE CXone`;
  document.title = `${marca.nombre} · Ficha del cliente`;
}
if (!P.dni) {
  $("contenido").innerHTML = '<div class="estado full">No se recibió el DNI del cliente (parámetro dni).</div>';
} else {
  render();             // 1) al instante, con lo que mandó el IVR
  completarDesdeApi();  // 2) completa desde la planilla
  // 3) a los 6 s refresca el historial (el contacto en curso se registra al atender)
  setTimeout(async () => {
    try {
      const h = await api("interacciones", P.dni);
      E.historial = h.interacciones || []; E.cambios = h.cambios || []; render();
    } catch (e) {}
  }, 6000);
}
</script>
</body>
</html>
