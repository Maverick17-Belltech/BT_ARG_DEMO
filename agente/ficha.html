<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha del cliente · BT_ARG Demo</title>
<!--
  BT_ARG_DEMO · Ficha del cliente para el agente (CXone Agent, POPURL → ContactPanel)  v4 (lectura + escritura)
  DEMO Belltech Argentina: TODOS LOS DATOS SON FICTICIOS.

  ESCRITURA: la clave de agente NO está en este archivo. El agente la ingresa una vez por pestaña
  (queda solo en sessionStorage de esa pestaña). Con la clave se habilita:
    - Cerrar contacto: tema + conclusión + nota → historial de interacciones (por ID de contacto).
    - Editar domicilio → planilla de alta + registro en "Cambios de datos".
    - Alta de cliente nuevo (si llega sin DNI o el DNI no existe).
  Los POST se envían como text/plain para evitar el bloqueo CORS del navegador.

  1) Se dibuja AL INSTANTE con los datos que manda el IVR en el link (nombre, alertas, cómo se identificó).
  2) Después completa en segundo plano desde la API (planilla): datos personales, producto, vista 360,
     historial de interacciones (planilla aparte BT_ARG_Interacciones_Demo) y cambios de datos (pestaña Historial).

  Parámetros (todos opcionales salvo dni y vertical):
    dni, vertical (BANCA|SEGUROS|FINANCIERA|LUZ|GAS), contacto, dato (DNI|MEDIDOR|CUENTA|CLIENTEGAS), ivr, res
    nom, ape          nombre y apellido que ya conoce el IVR
    escli             SI | NO  (cliente de esta vertical)
    venc              SI | NO  (DNI vencido)
    deuda             importe de deuda (Luz/Gas), ej. 12500.00
    mora              SI | NO  (Financiera)
    agente            ID del agente que atiende (para registrar quién hizo cada cambio)
  Ej.: agente/ficha.html?dni=33777888&vertical=GAS&dato=CLIENTEGAS&ivr=3-1&nom=Sebastian&ape=Sosa&escli=SI&venc=NO&deuda=12500.00&mora=NO
-->
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #1d2733; --muted: #5b6878; --line: #e2e7ed;
    --brand: #1f4e78; --brand-soft: #e8eef5;
    --ok: #1e7b45; --ok-soft: #e5f4ec; --warn: #9a5b00; --warn-soft: #fff3df;
    --bad: #b42318; --bad-soft: #fde8e6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: var(--text); background: var(--bg); }
  header { background: var(--brand); color: #fff; padding: 14px 16px; }
  header .marca { font-size: 18px; font-weight: bold; }
  header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  main { padding: 12px; display: grid; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  .nombre { font-size: 20px; font-weight: bold; margin: 0 0 4px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: bold; word-break: break-word; }
  .alertas { display: grid; gap: 8px; }
  .alerta { border-radius: 6px; padding: 10px 12px; font-weight: bold; }
  .alerta.bad { background: var(--bad-soft); color: var(--bad); border-left: 4px solid var(--bad); }
  .alerta.warn { background: var(--warn-soft); color: var(--warn); border-left: 4px solid var(--warn); }
  .alerta.ok { background: var(--ok-soft); color: var(--ok); border-left: 4px solid var(--ok); }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; background: var(--brand-soft); color: var(--brand); margin: 2px 4px 2px 0; }
  .chip.si { background: var(--ok-soft); color: var(--ok); }
  .chip.no { background: #eef0f3; color: var(--muted); }
  .chip.venc { background: var(--warn-soft); color: var(--warn); }
  .cargando { color: var(--muted); font-style: italic; }
  .estado { text-align: center; padding: 40px 16px; color: var(--muted); }
  footer { padding: 8px 12px 16px; font-size: 11px; color: var(--muted); text-align: center; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: bold; background: #f8fafb; }
  tr.actual td { background: var(--brand-soft); font-weight: bold; }
  .tabla { overflow-x: auto; }
  .acciones { padding: 0 12px 12px; display: grid; gap: 12px; }
  .barra-clave { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: #fff8e6; border: 1px solid #f0d58a; border-radius: 8px; padding: 10px 12px; }
  .barra-clave.ok { background: var(--ok-soft); border-color: #a7d8bb; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
  input, select, textarea { width: 100%; padding: 7px 8px; border: 1px solid #c9d2dc; border-radius: 6px; font: inherit; background: #fff; color: var(--text); }
  textarea { min-height: 60px; resize: vertical; }
  .barra-clave input { width: auto; flex: 1 1 180px; }
  .fila { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0 12px; }
  button { padding: 8px 14px; border: 0; border-radius: 6px; font: inherit; font-weight: bold; cursor: pointer; background: var(--brand); color: #fff; }
  button.sec { background: #e6eaef; color: var(--text); }
  button:disabled { opacity: .5; cursor: default; }
  .msg { font-weight: bold; margin-top: 8px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--bad); }
  details > summary { cursor: pointer; font-weight: bold; color: var(--brand); }
  .bloqueado { color: var(--muted); font-style: italic; }
  @media (min-width: 720px) { main { grid-template-columns: 1fr 1fr; } .full { grid-column: 1 / -1; } }
</style>
</head>
<body>
<header>
  <div class="marca" id="marca">Ficha del cliente</div>
  <div class="sub" id="subtitulo">Belltech Argentina · Demo NICE CXone</div>
</header>
<main id="contenido">
  <div class="estado full">Cargando datos del cliente…</div>
</main>
<section class="acciones" id="acciones"></section>
<footer>DEMO Belltech Argentina · Datos ficticios · Fuentes: BT_ARG_Alta_Datos_Demo (clientes y cambios) · BT_ARG_Interacciones_Demo (historial) · Google Sheets</footer>

<script>
// URL de la API de la demo (Apps Script). Lectura pública; la escritura exige la clave que ingresa el agente.
const API = "https://script.google.com/macros/s/AKfycbwmYcSf9tH_sZeU-rq1fZzFKtT7vawtmUJFaOJFmbiBiDBH8-m5vgQiYL_4qbEAbinOiA/exec";

const MARCAS = {
  BANCA:      { nombre: "Banco Andino",      rubro: "Banca",        color: "#1f4e78", clave: "banca" },
  SEGUROS:    { nombre: "Seguros del Plata", rubro: "Seguros",      color: "#5b2c83", clave: "seguros" },
  FINANCIERA: { nombre: "Crédito Pampa",     rubro: "Financiera",   color: "#0f6e5a", clave: "financiera" },
  GAS:        { nombre: "EnerGas Sur",       rubro: "Gas",          color: "#c4511a", clave: "gas" },
  LUZ:        { nombre: "VoltaSur Energía",  rubro: "Electricidad", color: "#b8860b", clave: "luz" }
};
const ETIQUETAS = {
  segmento: "Segmento", cuenta: "Cuenta", tarjeta: "Tarjeta", saldo: "Saldo", resumenDigital: "Resumen digital",
  poliza: "Póliza", ramo: "Ramo", cobertura: "Cobertura", vigenciaHasta: "Vigente hasta", siniestroAbierto: "Siniestro abierto",
  prestamo: "Préstamo", cuotasTotales: "Cuotas totales", cuotasPagas: "Cuotas pagas", cuotaMensual: "Cuota mensual",
  enMora: "En mora", diasMora: "Días de mora",
  nroMedidor: "N° de medidor", nroCuenta: "N° de cuenta", nroCliente: "N° de cliente",
  domicilioSuministro: "Domicilio de suministro", deuda: "Deuda", facturaDigital: "Factura digital"
};
const MONEDA = ["saldo", "cuotaMensual", "deuda"];
const DATO_TXT = { DNI: "DNI", MEDIDOR: "N° de medidor", CUENTA: "N° de cuenta", CLIENTEGAS: "N° de cliente" };

const q = new URLSearchParams(location.search);
const P = {
  dni: (q.get("dni") || "").replace(/\D/g, ""),
  vertical: (q.get("vertical") || "").toUpperCase(),
  contacto: q.get("contacto") || "",
  dato: (q.get("dato") || "").toUpperCase(),
  ivr: q.get("ivr") || "",
  nom: q.get("nom") || "",
  ape: q.get("ape") || "",
  escli: (q.get("escli") || "").toUpperCase(),
  venc: (q.get("venc") || "").toUpperCase(),
  deuda: q.get("deuda") || "",
  mora: (q.get("mora") || "").toUpperCase(),
  agente: q.get("agente") || ""
};
const marca = MARCAS[P.vertical];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pesos = (v) => {
  const n = Number(String(v).replace(",", "."));
  return isNaN(n) ? esc(v) : "$ " + n.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
const siNo = (v) => (v === true || String(v).toLowerCase() === "true" || String(v).toUpperCase() === "SI");
const CARGANDO = '<p class="cargando">Consultando sistema…</p>';

// Estado: arranca con lo que mandó el IVR; la API lo completa después.
const E = {
  nombre: P.nom, apellido: P.ape,
  esCliente: P.escli ? P.escli === "SI" : null,
  dniVencido: P.venc === "SI",
  deuda: P.deuda, enMora: P.mora === "SI",
  persona: null, producto: null, cli: null, apiError: false,
  historial: null, cambios: null
};

function alertas() {
  const a = [];
  const vert = P.vertical;
  const prod = E.producto || {};
  const deuda = prod.deuda !== undefined ? prod.deuda : E.deuda;
  const mora = prod.enMora !== undefined ? siNo(prod.enMora) : E.enMora;
  if (E.esCliente === false && marca) a.push(["warn", `No es cliente de ${marca.nombre}: oportunidad comercial.`]);
  if (["GAS", "LUZ"].includes(vert) && Number(deuda) > 0)
    a.push(["bad", `Deuda de ${pesos(deuda)}: riesgo de ${vert === "GAS" ? "suspensión" : "corte"} del suministro.`]);
  if (vert === "FINANCIERA" && mora)
    a.push(["bad", `Préstamo en mora${prod.diasMora ? ` (${esc(prod.diasMora)} días)` : ""}.`]);
  if (vert === "SEGUROS" && siNo(prod.siniestroAbierto)) a.push(["warn", "Tiene un siniestro abierto."]);
  if (["BANCA", "FINANCIERA"].includes(vert) && E.dniVencido)
    a.push(["warn", `DNI vencido${E.persona ? ` (venció el ${esc(E.persona.vencimiento)})` : ""}. Solicitar actualización.`]);
  if (a.length === 0) a.push(["ok", "Sin alertas. Cliente al día."]);
  return a.map(([t, m]) => `<div class="alerta ${t}">${m}</div>`).join("");
}

function bloquePersona() {
  if (E.apiError) return '<p class="cargando">No se pudo consultar el sistema. Los datos de arriba vienen del IVR.</p>';
  const p = E.persona;
  if (!p) return CARGANDO;
  const dom = [p.calle, p.numeroCalle, p.piso && `Piso ${p.piso}`, p.departamento && `Dto. ${p.departamento}`].filter(Boolean).join(" ");
  return `<dl>
    <dt>DNI</dt><dd>${esc(P.dni)}</dd>
    <dt>CUIL</dt><dd>${esc(p.cuil)}</dd>
    <dt>Nacimiento</dt><dd>${esc(p.fechaNacimiento)}</dd>
    <dt>Domicilio</dt><dd>${esc(dom)}</dd>
    <dt>Localidad</dt><dd>${esc(p.ciudad)}, ${esc(p.provincia)} (${esc(p.cpostal)})</dd>
    <dt>Ejemplar DNI</dt><dd>${esc(p.ejemplar)} · vence ${esc(p.vencimiento)}</dd>
  </dl>`;
}

function bloqueProducto() {
  if (E.apiError) return "";
  if (!E.cli) {
    // Mientras carga: si el IVR mandó la deuda, se muestra ya
    return (["GAS", "LUZ"].includes(P.vertical) && E.deuda !== "")
      ? `<dl><dt>Deuda</dt><dd>${pesos(E.deuda)}</dd></dl>${CARGANDO}` : CARGANDO;
  }
  const prod = E.producto;
  if (!prod || !prod.esCliente) return `<p>Sin productos de ${esc(marca ? marca.nombre : "esta marca")}.</p>`;
  return "<dl>" + Object.keys(prod)
    .filter(k => !["esCliente", "cantidadProductos"].includes(k))
    .map(k => {
      let v = prod[k];
      if (MONEDA.includes(k)) v = pesos(v);
      else if (typeof v === "boolean" || ["true", "false"].includes(String(v).toLowerCase())) v = siNo(v) ? "Sí" : "No";
      else v = esc(v);
      return `<dt>${esc(ETIQUETAS[k] || k)}</dt><dd>${v}</dd>`;
    }).join("") + "</dl>";
}

function bloque360() {
  if (E.apiError) return "";
  if (!E.cli) return CARGANDO;
  return Object.values(MARCAS).map(m => {
    const es = E.cli[m.clave] && E.cli[m.clave].esCliente;
    return `<span class="chip ${es ? "si" : "no"}">${esc(m.nombre)}: ${es ? "cliente" : "no"}</span>`;
  }).join("");
}

const RES_TXT = { OK: "Identificado", NO_CLIENTE: "No cliente", FALLO: "No validado", ERROR_API: "Sin validar (error)" };
const fechaCorta = (f) => esc(String(f || "").replace(/^(\d{4})-(\d{2})-(\d{2})/, "$3/$2/$1"));

function bloqueHistorial() {
  if (E.apiError) return '<p class="cargando">No se pudo consultar el historial.</p>';
  if (!E.historial) return CARGANDO;
  const filas = E.historial.slice();
  // El contacto en curso puede no estar registrado todavía: se muestra igual, destacado
  const yaEsta = P.contacto && filas.some(r => String(r.contactId) === String(P.contacto));
  if (P.contacto && !yaEsta) {
    filas.unshift({ fechaHora: "En curso", marca: marca ? marca.nombre : "", canal: "Voz", dato: P.dato, ivr: P.ivr,
                    resultado: "OK", agente: "", contactId: P.contacto, disposicion: "" });
  }
  if (filas.length === 0) return "<p>Sin interacciones registradas.</p>";
  return `<div class="tabla"><table>
    <tr><th>Fecha</th><th>Marca</th><th>Canal</th><th>Se identificó con</th><th>IVR</th><th>Resultado</th><th>Agente</th><th>Conclusión / tema</th></tr>
    ${filas.map(r => `<tr class="${String(r.contactId) === String(P.contacto) ? "actual" : ""}">
      <td>${String(r.contactId) === String(P.contacto) ? "Ahora" : fechaCorta(r.fechaHora)}</td>
      <td>${esc(r.marca)}</td><td>${esc(r.canal)}</td>
      <td>${esc(DATO_TXT[String(r.dato).toUpperCase()] || r.dato || "—")}</td>
      <td>${esc(r.ivr || "—")}</td>
      <td>${esc(RES_TXT[r.resultado] || r.resultado || "—")}</td>
      <td>${esc(r.agente || "—")}</td>
      <td>${esc([r.tema, r.disposicion].filter(Boolean).join(" — ") || "—")}${r.nota ? `<br><span class="bloqueado">${esc(r.nota)}</span>` : ""}</td></tr>`).join("")}
  </table></div>`;
}

function bloqueCambios() {
  if (E.apiError || !E.cambios) return E.apiError ? "" : CARGANDO;
  if (E.cambios.length === 0) return "<p>Sin cambios de datos registrados.</p>";
  return `<div class="tabla"><table>
    <tr><th>Fecha</th><th>Dato</th><th>Antes</th><th>Ahora</th><th>Agente</th></tr>
    ${E.cambios.map(c => `<tr><td>${fechaCorta(c.fechaHora)}</td><td>${esc(c.campo)} (${esc(c.hoja)})</td>
      <td>${esc(c.valorAnterior)}</td><td>${esc(c.valorNuevo)}</td><td>${esc(c.agente || "—")}</td></tr>`).join("")}
  </table></div>`;
}

function render() {
  const nombre = `${E.nombre} ${E.apellido}`.trim() || (E.persona ? `${E.persona.nombres} ${E.persona.apellido}` : `DNI ${P.dni}`);
  const chipCli = E.esCliente === null ? "" : `<span class="chip">${E.esCliente ? "Cliente" : "No cliente"}</span>`;
  const chipDni = `<span class="chip ${E.dniVencido ? "venc" : "si"}">DNI ${E.dniVencido ? "vencido" : "vigente"}</span>`;
  $("contenido").innerHTML = `
    <section class="card full">
      <p class="nombre">${esc(nombre)}</p>${chipCli}${chipDni}
    </section>
    <section class="card full"><h2>Alertas</h2><div class="alertas">${alertas()}</div></section>
    <section class="card"><h2>Datos personales</h2>${bloquePersona()}</section>
    <section class="card"><h2>${esc(marca ? marca.nombre : "Producto")}</h2>${bloqueProducto()}</section>
    <section class="card">
      <h2>Contacto actual</h2>
      <dl>
        <dt>ID de contacto</dt><dd>${esc(P.contacto || "—")}</dd>
        <dt>Se identificó con</dt><dd>${esc(DATO_TXT[P.dato] || P.dato || "—")}</dd>
        <dt>Opciones en el IVR</dt><dd>${esc(P.ivr || "—")}</dd>
        <dt>Validación</dt><dd>Padrón (formato RENAPER) + sistema comercial</dd>
      </dl>
    </section>
    <section class="card"><h2>Vista 360 · Grupo Belltech Demo</h2>${bloque360()}</section>
    <section class="card full"><h2>Historial de interacciones</h2>${bloqueHistorial()}</section>
    <section class="card full"><h2>Cambios de datos</h2>${bloqueCambios()}</section>`;
}

async function api(tipo, id) {
  const r = await fetch(`${API}?tipo=${encodeURIComponent(tipo)}&id=${encodeURIComponent(id)}`);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function completarDesdeApi() {
  try {
    const [ren, cli, hist] = await Promise.all([
      api("renaper", P.dni), api("clientes", P.dni),
      api("interacciones", P.dni).catch(() => ({ interacciones: [], cambios: [] }))
    ]);
    E.historial = (hist && hist.interacciones) || [];
    E.cambios = (hist && hist.cambios) || [];
    if (ren && ren.error) { mostrarAlta("El DNI " + P.dni + " no está en el sistema. Podés darlo de alta."); return; }
    if (ren && !ren.error && ren.respuesta) {
      E.persona = ren.respuesta;
      if (E.persona._demo) E.dniVencido = !E.persona._demo.vigente;
      if (!E.nombre) { E.nombre = cli.nombre || E.persona.nombres; E.apellido = cli.apellido || E.persona.apellido; }
    }
    if (cli && cli.encontrado !== false) {
      E.cli = cli;
      E.producto = marca ? (cli[marca.clave] || { esCliente: false }) : null;
      if (E.producto) E.esCliente = !!E.producto.esCliente;
    }
  } catch (e) {
    E.apiError = true;
  }
  render();
  completarDomicilio();
}

// Completa el formulario de domicilio cuando llegan los datos (sin pisar lo que el agente ya escribió)
function completarDomicilio() {
  const p = E.persona || {};
  const mapa = { dCalle: p.calle, dNumero: p.numeroCalle, dPiso: p.piso, dDepto: p.departamento, dCiudad: p.ciudad, dProv: p.provincia, dCP: p.cpostal };
  Object.keys(mapa).forEach(id => { const el = $(id); if (el && !el.value) el.value = mapa[id] || ""; });
}

async function refrescarDatos() {
  try {
    const [ren, h] = await Promise.all([api("renaper", P.dni), api("interacciones", P.dni)]);
    if (ren && ren.respuesta) E.persona = ren.respuesta;
    E.historial = h.interacciones || []; E.cambios = h.cambios || [];
    render();
  } catch (e) {}
}

/* ======================= ESCRITURA (requiere clave de agente) ======================= */

const TEMAS = {
  BANCA: ["Consulta de saldo / movimientos", "Resumen y adhesión digital", "Bloqueo de tarjeta", "Préstamo personal", "Reclamo", "Cambio de datos", "Otro"],
  SEGUROS: ["Consulta de póliza", "Denuncia de siniestro", "Seguimiento de siniestro", "Asistencia", "Renovación", "Cotización", "Cambio de datos", "Otro"],
  FINANCIERA: ["Consulta de cuotas", "Pago / medios de pago", "Refinanciación", "Nuevo préstamo", "Cambio de datos", "Otro"],
  GAS: ["Consulta de deuda / factura", "Plan de pago", "Factura digital", "Reconexión", "Emergencia / fuga", "Cambio de datos", "Otro"],
  LUZ: ["Consulta de deuda / factura", "Corte de suministro", "Plan de pago", "Factura digital", "Reclamo técnico", "Cambio de datos", "Otro"]
};
const CONCLUSIONES = ["Resuelto", "Venta", "Reclamo generado", "Derivado", "Callback agendado", "No resuelto"];
const PRODUCTO_ALTA = {
  BANCA: [["segmento", "Segmento", "Clásica"], ["cuenta", "Cuenta", "CA $ 0001-"], ["tarjeta", "Tarjeta", "Visa terminada en "]],
  SEGUROS: [["poliza", "Póliza", "AUT-"], ["ramo", "Ramo", "Automotor"], ["cobertura", "Cobertura", "Terceros completo"]],
  FINANCIERA: [["prestamo", "Préstamo", "PP-"], ["cuotasTotales", "Cuotas totales", "12"], ["cuotaMensual", "Cuota mensual", "0.00"]],
  LUZ: [["nroMedidor", "N° de medidor (10 dígitos)", ""], ["nroCuenta", "N° de cuenta (10 dígitos)", ""], ["domicilioSuministro", "Domicilio de suministro", ""]],
  GAS: [["nroCliente", "N° de cliente (12 dígitos)", ""], ["domicilioSuministro", "Domicilio de suministro", ""]]
};

let CLAVE = "";
try { CLAVE = sessionStorage.getItem("btarg_clave") || ""; } catch (e) {}

async function apiPost(cuerpo) {
  const r = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },   // evita el preflight CORS
    body: JSON.stringify(Object.assign({ clave: CLAVE, agente: P.agente, contactId: P.contacto }, cuerpo))
  });
  return r.json();
}

function aviso(id, ok, texto) {
  const el = $(id); if (!el) return;
  el.className = "msg " + (ok ? "ok" : "err");
  el.textContent = texto;
}

function barraClave() {
  if (CLAVE) return `<div class="barra-clave ok"><span>🔓 Edición habilitada para esta pestaña.</span>
    <button class="sec" onclick="salir()">Bloquear</button></div>`;
  return `<div class="barra-clave"><span>🔒 Para cerrar el contacto o editar datos, ingresá la clave de agente:</span>
    <input type="password" id="inClave" placeholder="Clave de agente" autocomplete="off">
    <button onclick="ingresar()">Habilitar</button><span id="msgClave" class="msg"></span></div>`;
}

async function ingresar() {
  const v = ($("inClave").value || "").trim();
  if (!v) return;
  CLAVE = v;
  try {
    const r = await apiPost({ accion: "validarClave" });
    if (!r.ok) throw new Error(r.mensaje || "Clave inválida");
    try { sessionStorage.setItem("btarg_clave", CLAVE); } catch (e) {}
    renderAcciones();
  } catch (e) {
    CLAVE = "";
    aviso("msgClave", false, "Clave inválida. Probá de nuevo.");
  }
}

function salir() {
  CLAVE = "";
  try { sessionStorage.removeItem("btarg_clave"); } catch (e) {}
  renderAcciones();
}

function opciones(lista) { return lista.map(x => `<option>${esc(x)}</option>`).join(""); }

function renderAcciones() {
  if (!P.dni) return;
  const cont = $("acciones");
  if (!CLAVE) { cont.innerHTML = barraClave(); return; }
  const temas = TEMAS[P.vertical] || TEMAS.BANCA;
  const p = E.persona || {};
  cont.innerHTML = barraClave() + `
    <section class="card">
      <h2>Cerrar contacto</h2>
      ${P.contacto ? "" : '<p class="bloqueado">Sin ID de contacto: se registra igual como interacción nueva.</p>'}
      <div class="fila">
        <div><label>Tema</label><select id="selTema">${opciones(temas)}</select></div>
        <div><label>Conclusión</label><select id="selConcl">${opciones(CONCLUSIONES)}</select></div>
      </div>
      <label>Nota para el historial (opcional)</label>
      <textarea id="txtNota" maxlength="300" placeholder="Ej.: se informó la deuda y se ofreció plan de pago"></textarea>
      <p><button id="btnCerrar" onclick="cerrarContacto()">Guardar conclusión</button> <span id="msgCerrar" class="msg"></span></p>
    </section>
    <section class="card">
      <details id="detDom"><summary>Editar domicilio</summary>
        <div class="fila">
          <div><label>Calle</label><input id="dCalle" value="${esc(p.calle || "")}"></div>
          <div><label>Número</label><input id="dNumero" value="${esc(p.numeroCalle || "")}"></div>
          <div><label>Piso</label><input id="dPiso" value="${esc(p.piso || "")}"></div>
          <div><label>Depto.</label><input id="dDepto" value="${esc(p.departamento || "")}"></div>
          <div><label>Ciudad</label><input id="dCiudad" value="${esc(p.ciudad || "")}"></div>
          <div><label>Provincia</label><input id="dProv" value="${esc(p.provincia || "")}"></div>
          <div><label>Código postal</label><input id="dCP" value="${esc(p.cpostal || "")}"></div>
        </div>
        <p><button id="btnDom" onclick="guardarDomicilio()">Guardar domicilio</button> <span id="msgDom" class="msg"></span></p>
      </details>
    </section>`;
}

async function cerrarContacto() {
  const btn = $("btnCerrar"); btn.disabled = true;
  try {
    const r = await apiPost({ accion: "conclusion", dni: P.dni, vertical: P.vertical, dato: P.dato, ivr: P.ivr,
      resultado: "OK", tema: $("selTema").value, disposicion: $("selConcl").value, nota: $("txtNota").value.trim() });
    if (!r.ok) throw new Error(r.mensaje);
    aviso("msgCerrar", true, "✓ Conclusión guardada en el historial");
    refrescarDatos();
  } catch (e) {
    aviso("msgCerrar", false, "No se pudo guardar (" + (e.message || "error") + "). Tus datos siguen cargados: reintentá.");
  }
  btn.disabled = false;
}

async function guardarDomicilio() {
  const btn = $("btnDom"); btn.disabled = true;
  const cambios = {
    calle: $("dCalle").value.trim().toUpperCase(), numeroCalle: $("dNumero").value.trim(),
    piso: $("dPiso").value.trim(), departamento: $("dDepto").value.trim(),
    ciudad: $("dCiudad").value.trim().toUpperCase(), provincia: $("dProv").value.trim().toUpperCase(), cpostal: $("dCP").value.trim()
  };
  if (!cambios.calle || !cambios.numeroCalle) { aviso("msgDom", false, "Calle y número son obligatorios."); btn.disabled = false; return; }
  try {
    const r = await apiPost({ dni: P.dni, hoja: "Personas", cambios });
    if (!r.ok) throw new Error(r.mensaje);
    aviso("msgDom", true, r.cambios.length ? `✓ Domicilio actualizado (${r.cambios.length} dato/s)` : "No había cambios para guardar");
    refrescarDatos();
  } catch (e) {
    aviso("msgDom", false, "No se pudo guardar (" + (e.message || "error") + "). Tus datos siguen cargados: reintentá.");
  }
  btn.disabled = false;
}

/* ----------------------- Alta de cliente nuevo ----------------------- */

function mostrarAlta(motivo) {
  const vert = P.vertical;
  const campos = PRODUCTO_ALTA[vert] || [];
  $("acciones").innerHTML = "";
  $("contenido").innerHTML = `
    <section class="card full">
      <p class="nombre">Cliente no identificado</p>
      <div class="alerta warn">${esc(motivo)}</div>
    </section>
    <section class="card full" id="cardAlta">
      <h2>Alta de cliente nuevo${marca ? " · " + esc(marca.nombre) : ""}</h2>
      ${CLAVE ? "" : `<div class="barra-clave"><span>🔒 Ingresá la clave de agente para dar de alta:</span>
        <input type="password" id="inClave" placeholder="Clave de agente" autocomplete="off">
        <button onclick="ingresarAlta()">Habilitar</button><span id="msgClave" class="msg"></span></div>`}
      <div class="fila">
        <div><label>DNI (7 u 8 dígitos) *</label><input id="aDni" inputmode="numeric" value="${esc(P.dni)}"></div>
        <div><label>Apellido *</label><input id="aApe"></div>
        <div><label>Nombres *</label><input id="aNom"></div>
        <div><label>Sexo</label><select id="aSexo"><option></option><option>F</option><option>M</option><option>X</option></select></div>
        <div><label>Fecha de nacimiento</label><input id="aNac" type="date"></div>
        <div><label>Calle *</label><input id="aCalle"></div>
        <div><label>Número *</label><input id="aNum"></div>
        <div><label>Piso</label><input id="aPiso"></div>
        <div><label>Depto.</label><input id="aDto"></div>
        <div><label>Ciudad</label><input id="aCiudad"></div>
        <div><label>Provincia</label><input id="aProv"></div>
        <div><label>Código postal</label><input id="aCP"></div>
      </div>
      ${campos.length ? `<h2 style="margin-top:14px">Producto ${marca ? esc(marca.nombre) : ""}</h2><div class="fila">
        ${campos.map(([k, l, v]) => `<div><label>${esc(l)}</label><input id="p_${k}" value="${esc(v)}"></div>`).join("")}</div>` : ""}
      <p class="bloqueado">Datos ficticios para la demo. Se carga con origen DEMO (se borra con el menú "BT_ARG Demo").</p>
      <p><button id="btnAlta" onclick="guardarAlta()" ${CLAVE ? "" : "disabled"}>Dar de alta</button> <span id="msgAlta" class="msg"></span></p>
    </section>`;
}

async function ingresarAlta() {
  const v = ($("inClave").value || "").trim(); if (!v) return;
  CLAVE = v;
  try {
    const r = await apiPost({ accion: "validarClave" });
    if (!r.ok) throw new Error();
    try { sessionStorage.setItem("btarg_clave", CLAVE); } catch (e) {}
    $("btnAlta").disabled = false;
    aviso("msgClave", true, "✓ Edición habilitada");
  } catch (e) { CLAVE = ""; aviso("msgClave", false, "Clave inválida."); }
}

async function guardarAlta() {
  const dni = ($("aDni").value || "").replace(/\D/g, "");
  const datos = {
    accion: "alta", dni, apellido: $("aApe").value.trim(), nombres: $("aNom").value.trim(), sexo: $("aSexo").value,
    fechaNacimiento: $("aNac").value, calle: $("aCalle").value.trim(), numeroCalle: $("aNum").value.trim(),
    piso: $("aPiso").value.trim(), departamento: $("aDto").value.trim(), ciudad: $("aCiudad").value.trim(),
    provincia: $("aProv").value.trim(), cpostal: $("aCP").value.trim(), vertical: P.vertical
  };
  if (dni.length < 7 || dni.length > 8) { aviso("msgAlta", false, "El DNI debe tener 7 u 8 dígitos."); return; }
  if (!datos.apellido || !datos.nombres || !datos.calle || !datos.numeroCalle) { aviso("msgAlta", false, "Completá los campos con *."); return; }
  const campos = PRODUCTO_ALTA[P.vertical] || [];
  if (campos.length) {
    datos.producto = {};
    campos.forEach(([k]) => { datos.producto[k] = $("p_" + k).value.trim(); });
    if (P.vertical === "LUZ") Object.assign(datos.producto, { deuda: "0.00", facturaDigital: "NO" });
    if (P.vertical === "GAS") Object.assign(datos.producto, { deuda: "0.00", facturaDigital: "NO" });
  }
  const btn = $("btnAlta"); btn.disabled = true;
  try {
    const r = await apiPost(datos);
    if (!r.ok) throw new Error(r.mensaje);
    aviso("msgAlta", true, "✓ Cliente dado de alta. Abriendo su ficha…");
    const u = new URLSearchParams(location.search);
    u.set("dni", dni); u.set("nom", datos.nombres.split(" ")[0]); u.set("ape", datos.apellido); u.set("escli", campos.length ? "SI" : "NO");
    setTimeout(() => { location.search = u.toString(); }, 1200);
  } catch (e) {
    aviso("msgAlta", false, "No se pudo dar de alta (" + (e.message || "error") + "). Tus datos siguen cargados.");
    btn.disabled = false;
  }
}

// ---- Inicio ----
if (marca) {
  document.documentElement.style.setProperty("--brand", marca.color);
  $("marca").textContent = marca.nombre;
  $("subtitulo").textContent = `${marca.rubro} · Ficha del cliente · Demo NICE CXone`;
  document.title = `${marca.nombre} · Ficha del cliente`;
}
if (!P.dni) {
  mostrarAlta("El cliente no se identificó en el IVR. Si no está en el sistema, podés darlo de alta.");
} else {
  render();             // 1) al instante, con lo que mandó el IVR
  renderAcciones();     //    barra de clave / cierre del contacto
  completarDesdeApi();  // 2) completa desde la planilla
  // 3) a los 6 s refresca el historial (el contacto en curso se registra al atender)
  setTimeout(async () => {
    try {
      const h = await api("interacciones", P.dni);
      E.historial = h.interacciones || []; E.cambios = h.cambios || []; render();
    } catch (e) {}
  }, 6000);
}
</script>
</body>
</html>
